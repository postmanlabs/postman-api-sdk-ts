name: Publish to GitHub Packages

on:
  push:
    branches: ['main']
  # Lets a publish that failed for a non-code reason (registry auth, a dist-tag
  # conflict) be retried without an empty commit on `main`.
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/_publish.yml
    permissions:
      contents: read
      packages: write
    with:
      registry-url: 'https://npm.pkg.github.com'
      scope: '@postmanlabs'
      package-name: '@postmanlabs/api-sdk'
      use-oidc: false
    secrets:
      node-auth-token: ${{ secrets.GITHUB_TOKEN }}
