name: Enrich SDK PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  enrich:
    # Only the SDK update PRs the Postman server opens.
    if: github.event.pull_request.user.login == 'mcpopenapibot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install oasdiff
        run: curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh

      - name: Build and apply enrichment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          CI_RUN_URL: https://github.com/${{ github.repository }}/actions/workflows/test.yml
        run: |
          set -euo pipefail
          SPEC=tests/integration/openapi.yaml
          if [ ! -f "$SPEC" ]; then
            echo "No $SPEC in this PR; nothing to enrich."
            exit 0
          fi
          # Baseline = the spec on the PR's base branch (the last published one).
          if git fetch --no-tags --depth=1 origin "$BASE_REF" 2>/dev/null \
            && git show "FETCH_HEAD:$SPEC" > /tmp/old.yaml 2>/dev/null && [ -s /tmp/old.yaml ]; then
            oasdiff diff /tmp/old.yaml "$SPEC" -f markup > /tmp/diff.md
            oasdiff breaking /tmp/old.yaml "$SPEC" -f json > /tmp/breaking.json || true
          else
            : > /tmp/diff.md
            echo '[]' > /tmp/breaking.json
          fi
          gh pr view "$PR_NUMBER" --json body -q .body > /tmp/body_in.md || : > /tmp/body_in.md
          SPEC_PATH="$SPEC" \
          DIFF_PATH=/tmp/diff.md \
          BREAKING_PATH=/tmp/breaking.json \
          CURRENT_BODY_PATH=/tmp/body_in.md \
          OUT_PATH=/tmp/body_out.md \
            node tests/enrich/enrich-pr.mjs
          gh pr edit "$PR_NUMBER" --body-file /tmp/body_out.md
