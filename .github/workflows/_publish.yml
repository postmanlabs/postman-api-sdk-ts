name: _publish

on:
  workflow_call:
    inputs:
      registry-url:
        required: true
        type: string
      scope:
        required: false
        type: string
        default: ''
      package-name:
        required: false
        type: string
        default: ''
      use-oidc:
        required: false
        type: boolean
        default: false
    secrets:
      node-auth-token:
        required: false
    outputs:
      version:
        value: ${{ jobs.publish.outputs.version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.scope }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run test

      - name: Test (harness units + integration sweep)
        run: npm run test:all

      # `package.json` is the version of record: every merge to `main` publishes whatever version
      # is in the tree. That assumes the merge carried a bump — a merge that didn't will fail here,
      # because npm rejects a re-publish. Stopgap until the SDK owns a version independent of the
      # spec's `info.version` (PSTAPI-1620).
      - name: Read the version to publish
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          echo "Publishing version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # GitHub Packages ties an npm scope to a real GitHub org/user installation — it must
      # match the repo owner (postmanlabs), not the npmjs.org package scope (@postman).
      - name: Set package name for this registry
        if: ${{ inputs.package-name != '' }}
        run: npm pkg set name="${{ inputs.package-name }}"

      # Both publishes let npm apply `latest` implicitly, which npm refuses when the
      # registry already holds a HIGHER version than the one being published. So a version
      # that reaches a registry by mistake blocks every later publish to it until that
      # version is removed — it can't be published past. See PSTAPI-1620.
      #
      # The OIDC path is validated against the trusted publisher configured on npmjs.org,
      # which pins the CALLER workflow's filename — see the header of `publish.yml`.
      - name: Publish via OIDC trusted publishing
        if: ${{ inputs.use-oidc }}
        run: npm publish --registry=${{ inputs.registry-url }} --provenance

      - name: Publish with token auth
        if: ${{ !inputs.use-oidc }}
        run: npm publish --registry=${{ inputs.registry-url }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.node-auth-token }}
