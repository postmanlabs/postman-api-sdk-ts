name: Publish

on:
  push:
    branches: ['main']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run test

      - name: Test (harness units + integration sweep)
        run: npm run test:all

      # `package.json` is the version of record: every merge to `main` publishes whatever version
      # is in the tree. That assumes the merge carried a bump — a merge that didn't will fail here,
      # because npm rejects a re-publish. Stopgap until the SDK owns a version independent of the
      # spec's `info.version` (PSTAPI-1620).
      - name: Read the version to publish
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          echo "Publishing version $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish to npm via trusted publishing (OIDC)
        # TODO: add --provenance once the repo is public (npm can't attest provenance for an internal repo)
        run: npm publish

      - name: Tag the release and publish notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --generate-notes --title "v$VERSION" --target "$GITHUB_SHA"
